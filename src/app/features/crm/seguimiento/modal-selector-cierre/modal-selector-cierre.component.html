<app-modal
  titulo="Cerrar Seguimiento Comercial"
  [subtitulo]="subtitulo()"
  icono="stop_circle"
  iconoColor="azul"
  ancho="md"
  (cerrar)="onCerrar()">

  <div class="msc-body">
    <p class="msc-pregunta">¿Cuál fue el resultado final del seguimiento?</p>

    @if (puedeAceptar()) {
      <button type="button" class="msc-opcion msc-opcion--ok" (click)="elegir('aceptar')">
        <span class="material-symbols-outlined msc-opcion__icono">check_circle</span>
        <div class="msc-opcion__texto">
          <strong>Aceptación</strong>
          <small>El cliente aprobó la propuesta (OC firmada, carta de intención, correo de confirmación o verbal).</small>
        </div>
        <span class="material-symbols-outlined msc-opcion__chevron">arrow_forward</span>
      </button>
    }

    @if (puedeRechazar()) {
      <button type="button" class="msc-opcion msc-opcion--rechazo" (click)="elegir('rechazar')">
        <span class="material-symbols-outlined msc-opcion__icono">cancel</span>
        <div class="msc-opcion__texto">
          <strong>Rechazo</strong>
          <small>El cliente comunicó un NO explícito (precio, timing, competencia, etc.).</small>
        </div>
        <span class="material-symbols-outlined msc-opcion__chevron">arrow_forward</span>
      </button>
    }

    @if (puedeCerrarSinVenta()) {
      <button type="button" class="msc-opcion msc-opcion--sin-venta" (click)="elegir('cerrar_sin_venta')">
        <span class="material-symbols-outlined msc-opcion__icono">remove_circle</span>
        <div class="msc-opcion__texto">
          <strong>Sin venta</strong>
          <small>El cliente dejó de responder o se descartó la oportunidad por otros motivos.</small>
        </div>
        <span class="material-symbols-outlined msc-opcion__chevron">arrow_forward</span>
      </button>
    }
  </div>

  <div modalFooter class="msc-footer">
    <app-button variant="ghost" (clic)="onCerrar()">Cancelar</app-button>
  </div>
</app-modal>
