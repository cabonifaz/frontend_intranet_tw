<app-modal
  titulo="Observar Orden de Compra"
  [subtitulo]="'Referencia: ' + numeroOc()"
  icono="flag"
  iconoColor="ambar"
  ancho="md"
  (cerrar)="onCerrar()">

  @if (cargando()) {
    <div class="ob-cargando">Cargando...</div>
  } @else {
    <h4 class="ob-seccion">MOTIVOS DE OBSERVACIÓN *</h4>
    <div class="ob-motivos">
      @for (m of motivosDisponibles(); track m.id) {
        <label class="ob-motivo" [class.ob-motivo--sel]="motivosSel().has(m.id)">
          <input type="checkbox" [checked]="motivosSel().has(m.id)"
                 (change)="toggleMotivo(m.id)" />
          <span>{{ m.nombre }}</span>
        </label>
      }
    </div>

    <div class="ob-field">
      <label>DETALLE DE LA OBSERVACIÓN *</label>
      <textarea rows="4" [(ngModel)]="detalle"
                placeholder="Describe el problema específico encontrado en la orden de compra..."></textarea>
    </div>

    <div class="ob-field">
      <label>RESPONSABLE DE CORRECCIÓN *</label>
      <select [(ngModel)]="idResponsable">
        <option [ngValue]="null" disabled>Seleccionar responsable...</option>
        @for (r of responsables(); track r.id) {
          <option [ngValue]="r.id">{{ r.nombre }} ({{ r.etiqueta }})</option>
        }
      </select>
    </div>

    <div class="ob-nota">
      <span class="material-symbols-outlined">warning</span>
      La OC quedará en estado <strong>OBSERVADA</strong> y no podrá liberar el expediente para programación.
    </div>
  }

  <div modalFooter class="ob-footer">
    <app-button variant="ghost" (clic)="onCerrar()">Cancelar</app-button>
    <app-button variant="warning" icono="flag"
                [disabled]="!formularioValido || guardando()"
                [cargando]="guardando()"
                (clic)="guardar()">Registrar Observación</app-button>
  </div>
</app-modal>
