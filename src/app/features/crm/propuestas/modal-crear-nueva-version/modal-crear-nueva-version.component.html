<app-modal titulo="Crear nueva versión de propuesta" ancho="md" (cerrar)="cerrar.emit()">
  <div class="mcnv-body">
    <div class="mcnv-info">
      <span class="material-symbols-outlined mcnv-info__icono">info</span>
      <p>
        La propuesta <strong>{{ codigoPropuesta() }}</strong> ya fue enviada a Visto Bueno.
        Si continúas se creará la versión <strong>{{ versionSiguiente }}</strong> y la actual quedará anulada.
      </p>
    </div>

    <!-- Motivo (requerido) -->
    <div class="mcnv-campo">
      <label>MOTIVO <span class="mcnv-obl">* Obligatorio</span></label>
      <select [ngModel]="idMotivo()" (ngModelChange)="idMotivo.set($event)">
        <option [ngValue]="null">Seleccione un motivo...</option>
        @for (m of motivos(); track m.id) {
          <option [ngValue]="m.id">{{ m.nombre }}</option>
        }
      </select>
    </div>

    <!-- Descripción (requerida por el back) -->
    <div class="mcnv-campo">
      <label>DESCRIPCIÓN DE CAMBIOS <span class="mcnv-obl">* Obligatorio</span></label>
      <textarea
        rows="3"
        placeholder="Detalla los cambios que harás en esta nueva versión..."
        [ngModel]="descripcion()"
        (ngModelChange)="descripcion.set($event)"
      ></textarea>
    </div>

  </div>

  <div modalFooter class="mcnv-footer">
    <app-button variant="ghost" (clic)="cerrar.emit()">Cancelar</app-button>
    <app-button
      variant="primary"
      icono="sync"
      [disabled]="!puedeContinuar()"
      [cargando]="enviando()"
      (clic)="onContinuar()"
    >
      {{ enviando() ? 'Creando...' : 'Crear nueva versión (' + versionSiguiente + ')' }}
    </app-button>
  </div>
</app-modal>
