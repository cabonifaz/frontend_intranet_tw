<div class="campo" [class.campo--full]="ancho() === 'full'">
  @if (label() || hint()) {
    <div class="campo__head">
      @if (label()) {
        <label class="campo__label">{{ label() }}</label>
      }
      @if (hint()) {
        <span class="campo__hint">{{ hint() }}</span>
      }
    </div>
  }
  <div class="campo__control">
    <ng-content></ng-content>
  </div>
  @if (error()) {
    <span class="campo__error">{{ error() }}</span>
  }
</div>
