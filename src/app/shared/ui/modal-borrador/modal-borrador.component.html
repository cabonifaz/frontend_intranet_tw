<app-modal titulo="Borrador no guardado disponible" ancho="sm" [cerrable]="false" (cerrar)="descartar.emit()">
  <div class="mb-body">
    <div class="mb-body__icono">
      <span class="material-symbols-outlined">drafts</span>
    </div>
    <p class="mb-body__texto">
      Tienes información sin guardar de este formulario desde el
      <strong>{{ fechaGuardado() | date:'dd/MM/yyyy HH:mm' }}</strong>.
    </p>
    <p class="mb-body__pregunta">¿Querés continuar donde lo dejaste o empezar en blanco?</p>
  </div>
  <div modalFooter class="mb-footer">
    <app-button variant="danger-ghost" tamano="md" icono="delete_sweep"
                (clic)="descartar.emit()">
      Descartar borrador
    </app-button>
    <app-button variant="primary" tamano="md" icono="restore"
                (clic)="restaurar.emit()">
      Restaurar borrador
    </app-button>
  </div>
</app-modal>
